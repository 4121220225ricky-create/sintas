function validateDatabase(d){const errors=[];for(const k of ['product','sourceRegistry','nationalContext','objectRegistryDemo','eventQueueDemo','caseWorkflowDemo','riskModel','decisionGates'])if(!d[k])errors.push('Kunci wajib tidak ada: '+k);for(const [a,key] of [[d.objectRegistryDemo,'objectId'],[d.eventQueueDemo,'eventId'],[d.caseWorkflowDemo,'caseId']])if(a&&new Set(a.map(x=>x[key])).size!==a.length)errors.push('ID duplikat: '+key);for(const o of d.objectRegistryDemo||[]){if(o.evidenceClass!=='SCENARIO')errors.push('Objek harus SCENARIO: '+o.objectId);for(const a of o.assertions||[])for(const k of ['regime','status','provider','effective_from','last_verified_at','evidence_class'])if(!(k in a))errors.push('Assertion tanpa '+k+' pada '+o.objectId)}for(const f of d.nationalContext?.coreFacts||[])if(!f.sourceIds?.length)errors.push('Fakta tanpa sumber: '+f.id);for(const c of d.caseWorkflowDemo||[])if(!c.owner||!c.nextAction||!c.reviewDue)errors.push('No Silent Hold: '+c.caseId);if(/"(NIK|realName|phone|exactAddress)"\s*:/i.test(JSON.stringify(d)))errors.push('Field identitas personal terdeteksi');return errors}

function sources(ids,context='Jejak sumber'){let list=[...new Set(ids||[])];openDrawer(`<div class="eyebrow">Provenance / sumber</div><h2>${esc(context)}</h2><p>Angka konteks, observasi pilot, dan kasus simulasi dibedakan menurut kelas bukti dan tanggal rujukan.</p>${list.length?list.map(id=>{let s=src(id);return s?`<div class="source-item"><span class="meta">${esc(s.institution)} · ${esc(s.year)} · ${esc(s.evidence_class)}</span><h3>${esc(s.title)}</h3><div class="tiny muted">${esc(s.limitations||'Batasan tidak dicantumkan')}</div><a href="${esc(s.url||'#')}" target="_blank" rel="noopener noreferrer">Buka dokumen sumber ↗</a><div class="meta" style="margin-top:7px">${esc(id)} · diakses ${esc(s.accessed_at||'—')}</div></div>`:`<div class="source-item">${esc(id)} · sumber tidak ditemukan</div>`}).join(''):'<p>Tidak ada rujukan publik: entri ini adalah skenario untuk demonstrasi, bukan klaim data riil.</p>'}`)}
function factCard(id){let f=fact(id);return `<button class="card stat btn" data-source="${esc(id)}"><span class="meta">${esc(f.valueType==='target'?'TARGET · BUKAN REALISASI':f.valueType==='target_scope'?'CAKUPAN TARGET':f.referenceYear||'KONTEKS NASIONAL')}</span><div class="num">${fmt(f.value)}${f.unit==='persen'?'%':''}</div><div class="label">${esc(f.label)}</div><small>${esc(f.unit)} · lihat sumber ↗</small></button>`}
const LVI_SCHEMA=[{id:'legal',name:'Kepastian hukum',cap:25,agency:'ATR/BPN',action:'Verifikasi hak dan status sertifikasi'}, {id:'spatial',name:'Tumpang tindih spasial',cap:25,agency:'Kehutanan / ESDM / Pemda',action:'Verifikasi layer spasial oleh instansi berwenang'}, {id:'pressure',name:'Tekanan pemanfaatan ruang',cap:25,agency:'OSS/BKPM / Pemda',action:'Periksa rencana aktivitas dan lokasi'}, {id:'integrity',name:'Integritas data',cap:15,agency:'Kementrans / BIG',action:'Rekonsiliasi asersi serta vintage data'}, {id:'social',name:'Kerentanan sosial',cap:10,agency:'Pemda / Kementrans',action:'Verifikasi jumlah keluarga dan ketergantungan lahan'}];

const LVI_DEMO={'TL-PR-0001':{parts:[23,23,18,16,8],exposure:{families:84,parcels:137,settlements:3},assumptions:['SHM dalam proses (skenario)','Potensi overlap hutan (skenario)','Tekanan kegiatan baru (asumsi skenario)','Bukti lintas sumber belum lengkap (skenario)','Ketergantungan penghidupan (asumsi skenario)']},'TL-PR-0002':{parts:[20,10,22,12,8],exposure:{families:null,parcels:null,settlements:null},assumptions:['Status hak belum final (skenario)','Tidak tersedia konfirmasi overlap','Permohonan usaha baru (skenario)','Status lintas instansi belum lengkap','Data ketergantungan lahan belum diverifikasi']},'TL-PR-0003':{parts:[12,8,7,15,4],exposure:{families:null,parcels:null,settlements:null},assumptions:['Perlu verifikasi hak','Belum tersedia layer sektoral','Tidak ada tekanan spesifik dalam skenario','Referensi administrasi berubah (skenario)','Data masyarakat belum tersedia']},'TL-PR-0004':{parts:[4,2,3,4,2],exposure:{families:null,parcels:null,settlements:null},assumptions:['SHM terbit (skenario)','Tidak ada sinyal overlap dalam demo','Tidak ada tekanan terhubung','Status parsial dan perlu pembaruan','Data sosial belum tersedia']}};
function lvi(o,activity='none'){let base=LVI_DEMO[o.objectId],parts=[...base.parts],done=state.interventions[o.objectId]||{};if(done.rights)parts[0]=Math.max(0,parts[0]-8);if(done.spatial)parts[1]=Math.max(0,parts[1]-10);if(done.data)parts[3]=Math.max(0,parts[3]-7);let before=parts.reduce((a,b)=>a+b,0),adds={none:0,mining:6,plantation:4,infrastructure:5,industry:6}[activity]||0;if(activity!=='none')parts[2]=Math.min(LVI_SCHEMA[2].cap,parts[2]+adds);return {parts,before,score:parts.reduce((a,b)=>a+b,0),max:100,activity,exposure:base.exposure,assumptions:base.assumptions,done}}
function lviBand(v){return v>=80?'Kritis':v>=60?'Prioritas':v>=35?'Perlu review':'Rendah'}
function lviVisual(o,compact=false){let v=lvi(o),parts=v.parts;return `<div class="lvi-head"><div><span class="meta">LAND VULNERABILITY INDEX · SIMULASI</span><strong>${v.score}<small>/100</small></strong></div>${badge(v.score>=80?'CRITICAL':v.score>=60?'HIGH':v.score>=35?'MEDIUM':'LOW')}</div><div class="lvi-stack" aria-label="Kontribusi lima dimensi risiko">${parts.map((n,i)=>`<span style="width:${n}%;background:${['#194b91','#326db6','#5891d3','#8cb7e6','#b7d2ed'][i]}" title="${LVI_SCHEMA[i].name}: ${n}/${LVI_SCHEMA[i].cap}"></span>`).join('')}</div>${!compact?`<div class="lvi-dims">${LVI_SCHEMA.map((d,i)=>`<button data-dim="${d.id}" class="lvi-dim"><span class="lvi-key" style="background:${['#194b91','#326db6','#5891d3','#8cb7e6','#b7d2ed'][i]}"></span><span>${d.name}</span><b>${parts[i]}/${d.cap}</b></button>`).join('')}</div>`:''}<div class="lvi-confidence"><span>Kepercayaan bukti <b>Belum terukur</b></span><span>Cakupan asersi <b>${o.assertions.length}/${DB.statusAssertionsSchema.regimes.length}</b></span></div>`}
function impact(o){let x=LVI_DEMO[o.objectId].exposure;return `<div class="impact-grid">${[['Keluarga',x.families],['Bidang',x.parcels],['Satuan permukiman',x.settlements]].map(([k,n])=>`<div><strong>${n==null?'—':fmt(n)}</strong><small>${k}</small></div>`).join('')}</div><div class="tiny muted mt">${x.families==null?'Belum tersedia data dampak sosial per objek.':'Angka dampak ini hanya asumsi skenario demo, bukan data penduduk/bidang Parit Rambutan riil.'}</div>`}

else if(n.dataset.view)goto(n.dataset.view);else if(n.dataset.object){state.selected=n.dataset.object;goto('object')}else if(n.dataset.source){let f=fact(n.dataset.source);sources(f?.sourceIds||[n.dataset.source],f?`${f.label} · ${fmt(f.value)} ${f.unit}`:'Profil dan sumber kawasan')}else if(n.dataset.sources)sources(n.dataset.sources.split(','));else if(n.dataset.case)showCase(n.dataset.case);else if(n.dataset.event)showEvent(n.dataset.event);else if(n.dataset.assert){let [id,reg]=n.dataset.assert.split('|');showAssertion(id,reg)}else if(n.dataset.tab){state.tab=n.dataset.tab;render()}else if(n.dataset.act==='export')exportDemo();else if(n.dataset.act==='csv')exportCSV();else if(['focusRegency','focusArea','focusSP'].includes(n.dataset.act)){state.province='Sumatera Selatan';state.area='Sumatera Selatan';render();toast(n.dataset.act==='focusSP'?'SP1 / SP2 adalah contoh demo':n.dataset.act==='focusArea'?'Kawasan pilot: Parit Rambutan':'Kabupaten Ogan Ilir dipilih')}else if(n.dataset.act==='clearInterventions'){state.interventions[state.selected]={};state.audit.unshift({time:new Date().toISOString(),objectId:state.selected,text:'Reset intervensi demo'});render();toast('Intervensi objek direset')}else if(n.dataset.act==='resetatlas'){state.province='';state.area='Semua area';state.atlasMetric='pronas';state.mapZoom=1;render();toast('Atlas direset')}else if(n.dataset.act==='resetfilters'){state.filters={};state.area='Semua area';state.sourceQuery='';state.sourceClass='';state.eventType='';$('globalArea').value='Semua area';$('globalEvidence').value='';$('globalCase').value='';$('globalLayer').value='risk';state.layer='risk';render();toast('Filter dashboard direset')}else if(n.dataset.act==='reset'){state.cases=structuredClone(DB.caseWorkflowDemo);state.audit=[];state.interventions={};state.pre=null;render();toast('Skenario demo direset')}else if(n.dataset.caseAction){let c=state.cases.find(x=>x.caseId===n.dataset.id);if(!c)return;let act=n.dataset.caseAction;if(act==='RESOLVED'||act==='REOPEN')c.state=act==='REOPEN'?'IN_PROGRESS':'RESOLVED';else if(act==='REVIEW')c.state='EXTERNAL_REVIEW';else if(act==='FLAG')c.state='EVIDENCE_GAP';else if(act==='VERIFY')c.state='EVIDENCE_VERIFIED';else if(act==='AUTHORITY')c.state='AUTHORITY_CONFIRMED';state.audit.unshift({time:new Date().toISOString(),text:`${c.caseId}: ${act} (simulasi)`});showCase(c.caseId);if(state.view==='cases'||state.view==='overview')render();toast('Status kasus demo diperbarui')}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')runGlobalSearch(e.target.value);else if(e.target.id==='sourceSearch'){state.sourceQuery=e.target.value;render()}else if(e.target.id==='regSearch'){state.filters.search=e.target.value;refreshRegistry()}});document.addEventListener('change',e=>{if(e.target.id==='regBand'){state.filters.band=e.target.value;refreshRegistry()}else if(e.target.id==='regCase'){state.filters.active=e.target.value;refreshRegistry()}else if(e.target.id==='regGap'){state.filters.gap=e.target.value;refreshRegistry()}else if(e.target.id==='objectSelect'||e.target.id==='citizenSelect'){state.selected=e.target.value;render()}else if(e.target.id==='atlasMetric'){state.atlasMetric=e.target.value;render();toast('Metrik atlas: '+e.target.options[e.target.selectedIndex].text)}else if(['homeObject','riskObject','outcomeObject'].includes(e.target.id)){state.selected=e.target.value;render();toast('Objek dipilih: '+e.target.value)}else if(e.target.id==='riskDim'){state.riskDim=e.target.value;render()}else if(e.target.id==='routeScenario'){state.routeScenario=e.target.value;render()}else if(e.target.id==='eventType'){state.eventType=e.target.value;render()}else if(e.target.id==='caseFilter'){state.caseFilter=e.target.value;render()}else if(e.target.id==='sourceClass'){state.sourceClass=e.target.value;render()}else if(e.target.id==='globalArea'){state.area=e.target.value;render();toast('Area disinkronkan: '+e.target.value)}else if(e.target.id==='globalEvidence'){state.filters.evidence=e.target.value;render();toast('Kelas evidensi diperbarui')}else if(e.target.id==='globalLayer'){state.layer=e.target.value;render();toast('Layer peta: '+e.target.value)}else if(e.target.id==='globalCase'){state.filters.case=e.target.value;render();toast('Status kasus diperbarui')}else if(e.target.id==='globalYear'){toast('Snapshot '+e.target.value+' dipilih') } });
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('globalSearch')?.focus()}if(e.key==='Escape'){$('searchResults')?.classList.remove('open')}});document.addEventListener('submit',e=>{if(e.target.id!=='clearForm')return;e.preventDefault();state.pre=computePre($('pcObject').value,$('pcActivity').value,$('pcCase').value.trim());$('pcResult').innerHTML=renderPre()});$('scrim').onclick=closeDrawer;$('closeDrawer').onclick=closeDrawer;$('mobileMenu').onclick=()=>$('sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(titles[v]){state.view=v;render()}});if(titles[location.hash.slice(1)])state.view=location.hash.slice(1);render();
</script></body></html>
